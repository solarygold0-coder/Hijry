name: Hijri iOS

on:
  pull_request:
    paths:
      - 'Hijri-iOS/**'
      - '.github/workflows/hijri-ios.yml'
  workflow_dispatch:
    inputs:
      export_ipa:
        description: Export a signed App Store IPA after the checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Build and check iPhone and iPad
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare iOS source
        run: |
          set -euo pipefail
          if [[ -f Hijri-5.16-iPhone-iPad-Xcode.zip ]]; then
            unzip -oq Hijri-5.16-iPhone-iPad-Xcode.zip 'Hijri-iOS/*'
          fi
          test -s Hijri-iOS/Hijri.xcodeproj/project.pbxproj
      - name: Validate project and calendar rules
        run: |
          xcodebuild -version
          plutil -lint Hijri-iOS/Hijri.xcodeproj/project.pbxproj
          bash Hijri-iOS/Checks/run-calendar-checks.sh
      - name: Archive and verify the iPhone and iPad build
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Hijri.xcarchive"
          xcodebuild -project Hijri-iOS/Hijri.xcodeproj -scheme Hijri -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            CODE_SIGNING_ALLOWED=NO archive
          app="$archive/Products/Applications/Hijri.app"
          test -s "$app/Hijri"
          test -s "$app/PlugIns/HijriWidget.appex/HijriWidget"
          test -s "$app/PrivacyInfo.xcprivacy"
      - name: Build the app and widget for iOS Simulator
        run: |
          xcodebuild -project Hijri-iOS/Hijri.xcodeproj -scheme Hijri -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/Hijri-iOS/build/simulator" \
            CODE_SIGNING_ALLOWED=NO build

  simulator:
    name: Launch on ${{ matrix.simulator }}
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.export_ipa }}
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        simulator: ['iPhone 17 Pro Max', 'iPad Pro 13-inch (M5)']
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HIJRI_SIMULATOR_MODEL: ${{ matrix.simulator }}
      HIJRI_ADHOC_SIMULATOR_SIGNING: '1'
      HIJRI_FRESH_SIMULATORS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build and launch on the simulator
        run: bash Hijri-iOS/Checks/run-simulator-checks.sh

  export:
    name: Export signed App Store IPA
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_ipa }}
    needs: check
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare iOS source
        run: |
          set -euo pipefail
          if [[ -f Hijri-5.16-iPhone-iPad-Xcode.zip ]]; then
            unzip -oq Hijri-5.16-iPhone-iPad-Xcode.zip 'Hijri-iOS/*'
          fi
          test -s Hijri-iOS/Hijri.xcodeproj/project.pbxproj
      - name: Sign and export with Apple Developer
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          HIJRI_BUNDLE_ID: ${{ vars.HIJRI_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?Set the Apple Developer Team ID in Actions variables}"
          : "${HIJRI_BUNDLE_ID:?Set the registered app bundle ID in Actions variables}"
          : "${ASC_KEY_ID:?Add the Apple team API key ID in Actions secrets}"
          : "${ASC_ISSUER_ID:?Add the Apple team issuer ID in Actions secrets}"
          : "${ASC_PRIVATE_KEY:?Add the Apple team private key in Actions secrets}"
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          export ASC_KEY_PATH="$key_dir/apple.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          unset ASC_PRIVATE_KEY
          bash Hijri-iOS/export-ipa.sh "$APPLE_TEAM_ID" "$HIJRI_BUNDLE_ID"
      - name: Make the signed IPA available for download
        uses: actions/upload-artifact@v7
        with:
          path: Hijri-iOS/build/export.*/ipa/Hijri.ipa
          archive: false
          if-no-files-found: error
